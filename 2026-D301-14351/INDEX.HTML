<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="CALCULATOR">
        <div class="display">0</div>
        <div class="buttons">
        <button class="btn">AC</button>
        <button>00</button>
        <button>%</button>
        <button class="orange">/</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="orange">x</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="orange">-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="orange">+</button>

        <button class="dark">0</button>
        <button>.</button>
        <button class="orange">=</button>

        </div>
    </div>
    
</body>
</html>
